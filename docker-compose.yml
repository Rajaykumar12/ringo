version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      - redis
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      # The frontend's nginx is the only thing in front of the backend, so its
      # container IP is the one allowed to assert X-Forwarded-For. Without this the
      # rate limiter keys every request on the proxy and one client throttles all.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/chroma_db:/app/chroma_db

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
 app-network:
  driver: bridge