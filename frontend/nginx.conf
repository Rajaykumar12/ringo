server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The SPA loads no third-party scripts and talks only to the
    # API origin, so the policy can stay tight. img-src is the third layer of the
    # image-exfiltration defence (backend rag.py sanitizer, frontend MarkdownImage
    # allow-list, then this).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${API_ORIGIN}; media-src 'self' blob: data:; connect-src 'self' ${API_ORIGIN}; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves clients pinned to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — react-router owns client-side paths, so a deep link or a
    # refresh on /settings must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
