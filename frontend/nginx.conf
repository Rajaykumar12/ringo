server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The SPA loads no third-party scripts and talks only to the
    # API origin, so the policy can stay tight. img-src is the third layer of the
    # image-exfiltration defence (backend rag.py sanitizer, frontend MarkdownImage
    # allow-list, then this).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${API_ORIGIN}; media-src 'self' blob: data:; connect-src 'self' ${API_ORIGIN}; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # API proxy. Serving the API from the same origin as the SPA is what makes
    # `docker compose up` work with no configuration: the bundle falls back to
    # window.location.origin when VITE_API_URL is unset, so without this the app
    # would call itself and get index.html back from the SPA fallback below.
    # Same-origin also takes CORS out of the picture entirely for this path.
    #
    # Prefixes are listed explicitly rather than as a catch-all because /admin is a
    # react-router page (the dashboard UI) while /admin/stats and /admin/logs are
    # backend routes — proxying bare /admin would 404 the page it is meant to serve.
    # /settings is likewise SPA-only, and / is the chat page, not the backend root.

    # Docker's embedded DNS. Resolving through a variable rather than naming the
    # upstream directly in proxy_pass is deliberate: nginx resolves a literal
    # upstream once at startup and refuses to start at all if it doesn't resolve,
    # so the frontend would crash-loop whenever it came up before the backend, or
    # when run on its own. Via a variable, resolution happens per request instead,
    # and valid=10s means a recreated backend container's new IP is picked up
    # rather than cached until the next reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(?:chat|documents|images|tts)/|^/(?:conversations|feedback)$|^/health(?:/|$)|^/admin/(?:stats|logs)$ {
        # $request_uri is required here: when proxy_pass contains a variable, nginx
        # does not append the original URI automatically the way it does for a
        # literal upstream. Without it every proxied request would hit "/".
        set $ringo_backend "http://backend:8000";
        proxy_pass $ringo_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming chat is server-sent events. Without disabling buffering nginx
        # holds the whole reply and releases it at the end, so the answer appears
        # in one block instead of token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves clients pinned to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — react-router owns client-side paths, so a deep link or a
    # refresh on /settings must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
