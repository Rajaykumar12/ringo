name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # The runner's bundled pip/setuptools carry their own advisories and would
          # fail the audit below on toolchain rather than app dependencies.
          pip install --upgrade pip setuptools
          pip install -r backend/requirements.txt
      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          # Audits the resolved environment, so transitive packages are covered too.
          # The --ignore-vuln entries are chromadb advisories with NO fixed version
          # published upstream: without them this step can never pass, and a step
          # that always fails gets muted, which is worse than a narrow documented
          # exception. Re-check these whenever chromadb is bumped and drop any that
          # have gained a fix.
          pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: Run tests
        working-directory: backend
        env:
          GROQ_API_KEY: test-key-for-import-time-check
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
