name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # pip upgrades cleanly; setuptools deliberately does not — see the audit step.
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          # Audits the resolved environment, so transitive packages are covered too.
          # Two documented exceptions, both unfixable rather than unimportant — a step
          # that always fails gets muted, which is worse than a narrow exception:
          #   PYSEC-2026-311/3813/3814/3815 — chromadb, no fixed version published
          #     upstream. Re-check on every chromadb bump and drop any that gain a fix.
          #   PYSEC-2026-3447 — setuptools, fixed in 83.0.0, but torch pins
          #     setuptools<82, so no torch-compatible release carries the fix. It is
          #     build tooling rather than request-path code. Drop this when torch
          #     relaxes that pin.
          pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-3447
      - name: Run tests
        working-directory: backend
        env:
          GROQ_API_KEY: test-key-for-import-time-check
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
